<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e293b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda alumnos">
<meta name="application-name" content="Agenda de alumnos particulares">
<meta name="description" content="Agenda personal para gestionar alumnos, clases y pagos">
<title>Agenda de alumnos particulares</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<style>
:root {
    --primary: #1e293b;
    --primary-dark: #0f172a;
    --primary-soft: #334155;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
    --success: #166534;
    --success-bg: #f0fdf4;
    --danger: #991b1b;
    --danger-bg: #fef2f2;
    --warning: #92400e;
    --warning-bg: #fffbeb;
    --accent: #475569;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
}

/* HEADER */

.header {
    background: var(--primary);
    color: #f8fafc;
    padding: 18px 16px;
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid var(--primary-dark);
}

.header-title {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.02em;
}

.header-subtitle {
    font-size: 12px;
    opacity: .7;
    margin-top: 3px;
    font-weight: 400;
}

/* NAV */

.nav {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 8px 10px;
    background: white;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 68px;
    z-index: 15;
}

.nav button {
    flex: 0 0 auto;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 6px;
    font-weight: 500;
    font-size: 13px;
}

.nav button:hover {
    background: #f1f5f9;
    color: var(--text);
}

.nav button.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
}

/* CONTENT */

.content {
    padding: 14px 12px;
    padding-bottom: 90px;
}

.card {
    background: var(--card);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}

.card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text);
    letter-spacing: 0.01em;
}

.muted {
    color: var(--muted);
}

.small {
    font-size: 13px;
}

/* BUTTONS */

.btn {
    width: 100%;
    border: 0;
    border-radius: 8px;
    background: var(--primary);
    color: white;
    padding: 10px 14px;
    font-weight: 500;
    font-size: 14px;
}

.btn:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: white;
    color: var(--text);
    padding: 8px 12px;
    font-weight: 500;
    font-size: 13px;
}

.btn-secondary:hover {
    background: #f8fafc;
}

.btn-danger {
    border: 1px solid #fecaca;
    border-radius: 8px;
    background: var(--danger-bg);
    color: var(--danger);
    padding: 8px 12px;
    font-weight: 500;
    font-size: 13px;
}

.btn-success {
    border: 1px solid #bbf7d0;
    border-radius: 8px;
    background: var(--success-bg);
    color: var(--success);
    padding: 8px 12px;
    font-weight: 500;
    font-size: 13px;
}

.btn-warning {
    border: 1px solid #fde68a;
    border-radius: 8px;
    background: var(--warning-bg);
    color: var(--warning);
    padding: 8px 12px;
    font-weight: 500;
    font-size: 13px;
}

/* FORMS */

.form-group {
    margin-bottom: 12px;
}

label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 5px;
    color: var(--muted);
    letter-spacing: 0.01em;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    background: white;
    color: var(--text);
    transition: border-color 0.15s;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #94a3b8;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.actions button {
    flex: 1;
    min-width: 90px;
}

/* DASHBOARD */

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
}

.stat {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
}

.stat-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}

.stat-value {
    font-size: 17px;
    font-weight: 600;
    margin-top: 4px;
    color: var(--text);
}

/* CALENDAR */

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 14px;
}

.calendar-title {
    text-align: center;
    font-weight: 600;
    text-transform: capitalize;
    font-size: 15px;
}

.weekdays,
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
}

.weekday {
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    padding: 4px 0;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.calendar-day {
    min-height: 76px;
    background: #fafbfc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px;
    cursor: pointer;
    overflow: hidden;
}

.calendar-day:hover {
    border-color: #94a3b8;
    background: #f1f5f9;
}

.calendar-day.today {
    border: 1.5px solid var(--primary);
    background: #f1f5f9;
}

.calendar-day.selected {
    background: #e2e8f0;
    border-color: #94a3b8;
}

.day-number {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
}

.lesson-mini {
    display: block;
    background: #e2e8f0;
    color: #334155;
    border-radius: 4px;
    padding: 2px 4px;
    margin-top: 3px;
    font-size: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 500;
}

.lesson-mini.pending {
    background: #e2e8f0;
    color: #334155;
}

.lesson-mini.attended {
    background: #dcfce7;
    color: #166534;
}

.lesson-mini.absent {
    background: #fee2e2;
    color: #991b1b;
}

.today-tag {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--primary);
    margin-left: 4px;
}

/* LESSON */

.lesson {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
    background: white;
}

.lesson-main {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
}

.lesson-time {
    font-size: 18px;
    font-weight: 600;
    min-width: 60px;
    color: var(--text);
}

.lesson-name {
    font-weight: 600;
}

.lesson-info {
    color: var(--muted);
    font-size: 13px;
    margin-top: 3px;
}

.status {
    display: inline-block;
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
}

.status.pending {
    background: #f1f5f9;
    color: #475569;
}

.status.attended {
    background: var(--success-bg);
    color: var(--success);
}

.status.absent {
    background: var(--danger-bg);
    color: var(--danger);
}

/* STUDENTS */

.student-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
    background: white;
}

.student-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.student-name {
    font-weight: 600;
}

.balance {
    font-weight: 600;
    font-size: 14px;
}

.balance.zero {
    color: var(--success);
}

.balance.pending {
    color: var(--danger);
}

/* PENDING LESSONS DETAIL */

.pending-lessons {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
}

.pending-lesson-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    padding: 6px 0;
    font-size: 13px;
    border-bottom: 1px solid #f3f4f6;
}

.pending-lesson-item:last-child {
    border-bottom: 0;
}

.pending-lesson-info {
    flex: 1;
}

.pending-lesson-amount {
    font-weight: 700;
    white-space: nowrap;
}

.pending-lesson-amount.partial {
    color: var(--warning);
}

.student-balance-block {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
}

.student-balance-block:last-child {
    border-bottom: 0;
}

.student-balance-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

/* PRINT / PDF */

@media print {
    body * {
        visibility: hidden !important;
    }
    #printArea,
    #printArea * {
        visibility: visible !important;
    }
    #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 16px;
        background: white;
        color: black;
    }
    .modal-backdrop {
        position: static !important;
        background: none !important;
        display: block !important;
        padding: 0 !important;
    }
    .modal {
        box-shadow: none !important;
        max-width: 100% !important;
        max-height: none !important;
        overflow: visible !important;
        padding: 0 !important;
        border-radius: 0 !important;
    }
    .no-print {
        display: none !important;
    }
}

.print-doc {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 700px;
    margin: 0 auto;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
}

.print-doc h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
    color: #0f172a;
    letter-spacing: 0.01em;
}

.print-doc h2 {
    font-size: 13px;
    font-weight: 600;
    color: #0f172a;
    letter-spacing: 0.02em;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 6px;
}

.print-doc .meta {
    color: #64748b;
    font-size: 12px;
    margin-bottom: 20px;
}

.print-doc table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 12px;
}

.print-doc th,
.print-doc td {
    border: 1px solid #e2e8f0;
    padding: 8px 10px;
    text-align: left;
}

.print-doc th {
    background: #f8fafc;
    font-weight: 600;
    color: #475569;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
}

.print-doc .total-row {
    font-weight: 600;
    background: #f8fafc;
}

.print-doc .status-attended { color: #166534; }
.print-doc .status-absent { color: #991b1b; }
.print-doc .status-pending { color: #475569; }

.print-doc .print-footer {
    margin-top: 28px;
    padding-top: 12px;
    border-top: 1px solid #e2e8f0;
    font-size: 11px;
    color: #94a3b8;
}

/* EMPTY */

.empty {
    text-align: center;
    color: var(--muted);
    padding: 28px 10px;
    font-size: 14px;
}

/* MODAL */

.modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.4);
    z-index: 100;
    padding: 15px;
    align-items: center;
    justify-content: center;
}

.modal-backdrop.open {
    display: flex;
}

.modal {
    background: white;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 12px;
    padding: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(15, 23, 42, 0.12);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
}

.modal-title {
    font-size: 16px;
    font-weight: 600;
}

.close {
    border: 1px solid var(--border);
    background: white;
    border-radius: 6px;
    width: 32px;
    height: 32px;
    font-size: 16px;
    color: var(--muted);
}

.close:hover {
    background: #f8fafc;
    color: var(--text);
}

/* FAB */

.fab {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 0;
    background: var(--primary);
    color: white;
    font-size: 24px;
    font-weight: 300;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    z-index: 30;
}

.fab:hover {
    background: var(--primary-dark);
}

/* TOAST */

.toast {
    position: fixed;
    left: 50%;
    bottom: 85px;
    transform: translateX(-50%);
    background: var(--primary);
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    z-index: 200;
    display: none;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
}

.toast.show {
    display: block;
}

/* RESPONSIVE */

@media (max-width: 600px) {
    .dashboard {
        grid-template-columns: 1fr 1fr;
    }

    .dashboard .stat:last-child {
        grid-column: span 2;
    }

    .calendar-day {
        min-height: 62px;
    }

    .lesson-mini {
        font-size: 9px;
    }
}

@media (min-width: 700px) {
    .calendar-day {
        min-height: 95px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="header-title">Agenda de alumnos particulares</div>
        <div class="header-subtitle">Gestión de alumnos y clases</div>
    </header>

    <nav class="nav" id="nav"></nav>

    <main class="content" id="content"></main>

</div>

<button class="fab" id="fab" title="Nueva clase">+</button>

<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   CONFIGURACIÓN Y BASE DE DATOS
   ========================================================= */

const STORAGE_KEY = "agenda_alumnos_v5";
const LEGACY_STORAGE_KEYS = ["agenda_tutor_v4_final"];
const BACKUP_META_KEY = "agenda_alumnos_last_backup";

const DEFAULT_DB = {
    students: [],
    lessons: [],
    payments: [],
    settings: {
        hourlyRate: 10000
    }
};

let db = loadDatabase();

let state = {
    section: "calendar",
    currentMonth: new Date(),
    selectedDate: new Date(),
    showAllPayments: false
};


/* =========================================================
   FUNCIONES GENERALES
   ========================================================= */

function normalizeDbPayload(data) {

    const students = Array.isArray(data.students) ? data.students : [];

    students.forEach(s => {
        if (s && s.liquidatedAmount == null) {
            s.liquidatedAmount = 0;
        }
        if (s && s.inactive == null) {
            s.inactive = false;
        }
    });

    const settings = data.settings && typeof data.settings === "object"
        ? data.settings
        : {};

    if (settings.hourlyRate == null || !Number.isFinite(Number(settings.hourlyRate))) {
        settings.hourlyRate = 10000;
    } else {
        settings.hourlyRate = Number(settings.hourlyRate);
    }

    return {
        students,
        lessons: Array.isArray(data.lessons) ? data.lessons : [],
        payments: Array.isArray(data.payments) ? data.payments : [],
        settings
    };
}


function loadDatabase() {

    try {

        let saved = localStorage.getItem(STORAGE_KEY);
        let fromLegacy = false;

        if (!saved) {
            for (const key of LEGACY_STORAGE_KEYS) {
                const legacy = localStorage.getItem(key);
                if (legacy) {
                    saved = legacy;
                    fromLegacy = true;
                    break;
                }
            }
        }

        if (!saved) {
            return structuredClone(DEFAULT_DB);
        }

        const data = JSON.parse(saved);
        const normalized = normalizeDbPayload(data);

        // Migrar a la clave nueva si venía de una versión anterior
        if (fromLegacy) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
            } catch (e) {
                console.warn("No se pudo migrar la clave de almacenamiento:", e);
            }
        }

        return normalized;

    } catch (error) {

        console.error("Error leyendo datos:", error);

        return structuredClone(DEFAULT_DB);
    }
}


function saveDatabase() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(db)
    );

    try {
        localStorage.setItem(
            "agenda_alumnos_last_activity",
            new Date().toISOString()
        );
    } catch (e) {
        /* ignore */
    }
}


function getActiveStudents() {

    return db.students.filter(s => !s.inactive);
}


function getHourlyRate() {

    const rate = Number(db.settings?.hourlyRate);
    return Number.isFinite(rate) && rate >= 0 ? rate : 10000;
}


function openHourlyRateEditor() {

    const current = getHourlyRate();
    const input = prompt(
        "Precio por hora ($)\n\n" +
        "Se usará por defecto al crear clases en modo «por hora».\n" +
        "Las clases ya cargadas no cambian.",
        String(current)
    );

    if (input === null) {
        return;
    }

    const value = Number(String(input).replace(",", "."));

    if (!Number.isFinite(value) || value < 0) {
        alert("Ingresá un monto válido.");
        return;
    }

    if (value === current) {
        return;
    }

    const ok = confirm(
        `¿Cambiar el precio por hora de ${formatMoney(current)} a ${formatMoney(value)}?\n\n` +
        `Solo afecta clases nuevas (o las que edites en modo por hora).\n` +
        `Las clases ya guardadas mantienen su precio.`
    );

    if (!ok) {
        return;
    }

    if (!db.settings) {
        db.settings = {};
    }
    db.settings.hourlyRate = value;
    saveDatabase();
    render();
    showToast("Precio por hora actualizado");
}


function getUnmarkedLessonsForDate(dateKeyStr) {

    return db.lessons.filter(l =>
        l.date === dateKeyStr &&
        (l.status || "pending") === "pending"
    );
}


function addWeeksToDateKey(dateKeyStr, weeks) {

    const d = dateFromKey(dateKeyStr);
    d.setDate(d.getDate() + (weeks * 7));
    return dateKeyFromDate(d);
}


function generateId(prefix = "id") {

    if (window.crypto && crypto.randomUUID) {
        return crypto.randomUUID();
    }

    return prefix + "_" + Date.now() + "_" + Math.random().toString(36).slice(2);
}


function formatMoney(value) {

    return new Intl.NumberFormat("es-AR", {
        style: "currency",
        currency: "ARS",
        maximumFractionDigits: 0
    }).format(Number(value) || 0);
}


/*
    MUY IMPORTANTE:

    No usamos new Date("2026-09-30")
    porque eso puede interpretarse como UTC.

    Creamos siempre las fechas manualmente.
*/

function dateKey(year, month, day) {

    return (
        String(year) +
        "-" +
        String(month + 1).padStart(2, "0") +
        "-" +
        String(day).padStart(2, "0")
    );
}


function dateKeyFromDate(date) {

    return dateKey(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );
}


function dateFromKey(key) {

    const parts = key.split("-").map(Number);

    return new Date(
        parts[0],
        parts[1] - 1,
        parts[2],
        12,
        0,
        0,
        0
    );
}


function todayKey() {

    return dateKeyFromDate(new Date());
}


function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function formatDate(date) {

    return date.toLocaleDateString("es-AR", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}


function showToast(message) {

    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);
}


/* =========================================================
   ALUMNOS
   ========================================================= */

function getStudent(id) {

    return db.students.find(student => student.id === id);
}


/** Monto de clases ya archivadas (pagadas y borradas del historial). */
function getStudentLiquidated(studentId) {

    const student = getStudent(studentId);
    return Math.max(0, Number(student?.liquidatedAmount || 0));
}


/** Suma de pagos registrados (histórico de lo cobrado). */
function getStudentRawPaid(studentId) {

    return db.payments
        .filter(p => p.studentId === studentId)
        .reduce((sum, p) => sum + Number(p.amount || 0), 0);
}


/**
 * Pagos aún "activos" para saldo y FIFO:
 * cobrado total menos lo ya liquidado al archivar clases pagadas.
 */
function getStudentEffectivePaid(studentId) {

    return Math.max(
        0,
        getStudentRawPaid(studentId) - getStudentLiquidated(studentId)
    );
}


/** Total cobrado por clases asistidas (activas, no archivadas). */
function getStudentCharged(studentId) {

    return db.lessons
        .filter(lesson =>
            lesson.studentId === studentId &&
            lesson.status === "attended"
        )
        .reduce(
            (total, lesson) => total + Number(lesson.price || 0),
            0
        );
}


/**
 * Saldo adeudado = clases ASISTIDAS − pagos efectivos (≥ 0).
 * Las pendientes no suman deuda (mismo criterio que el PDF).
 */
function getStudentBalance(studentId) {

    const charged = getStudentCharged(studentId);
    const paid = getStudentEffectivePaid(studentId);

    return Math.max(0, charged - paid);
}


/**
 * Crédito / pago adelantado (≥ 0).
 * Se descuenta solo cuando haya clases marcadas como asistidas.
 */
function getStudentCredit(studentId) {

    const charged = getStudentCharged(studentId);
    const paid = getStudentEffectivePaid(studentId);

    return Math.max(0, paid - charged);
}


/**
 * Etiqueta unificada de saldo en toda la app.
 * { text, css: "pending" | "zero" }
 */
function getBalanceDisplay(studentId) {

    const credit = getStudentCredit(studentId);
    const balance = getStudentBalance(studentId);

    if (credit > 0) {
        return {
            text: "A favor " + formatMoney(credit),
            css: "zero"
        };
    }

    if (balance > 0) {
        return {
            text: "Debe " + formatMoney(balance),
            css: "pending"
        };
    }

    return {
        text: "Al día",
        css: "zero"
    };
}


function getTotalPending() {

    return db.students.reduce(
        (total, student) =>
            total + getStudentBalance(student.id),
        0
    );
}


/**
 * Asigna pagos efectivos FIFO sobre clases asistidas.
 * Devuelve las que todavía tienen saldo pendiente.
 */
function getStudentPendingLessons(studentId) {

    const totalPaid = getStudentEffectivePaid(studentId);

    const lessons = db.lessons
        .filter(l =>
            l.studentId === studentId &&
            l.status === "attended"
        )
        .slice()
        .sort((a, b) => {
            const dateCmp = a.date.localeCompare(b.date);
            if (dateCmp !== 0) return dateCmp;
            return a.time.localeCompare(b.time);
        });

    let remainingPaid = totalPaid;
    const pending = [];

    for (const lesson of lessons) {

        const price = Number(lesson.price) || 0;

        if (remainingPaid >= price) {
            remainingPaid -= price;
            continue;
        }

        const owed = price - remainingPaid;
        pending.push({
            ...lesson,
            owed,
            originalPrice: price,
            partial: remainingPaid > 0
        });
        remainingPaid = 0;
    }

    return pending;
}


/**
 * Estado de pago FIFO por clase asistida:
 * "yes" | "partial" | "no"
 */
function getAttendedPaidStatusMap(studentId) {

    const totalPaid = getStudentEffectivePaid(studentId);

    const lessons = db.lessons
        .filter(l =>
            l.studentId === studentId &&
            l.status === "attended"
        )
        .slice()
        .sort((a, b) => {
            const dateCmp = a.date.localeCompare(b.date);
            if (dateCmp !== 0) return dateCmp;
            return a.time.localeCompare(b.time);
        });

    const map = {};
    let remainingPaid = totalPaid;

    for (const lesson of lessons) {
        const price = Number(lesson.price) || 0;
        if (remainingPaid >= price) {
            remainingPaid -= price;
            map[lesson.id] = "yes";
        } else if (remainingPaid > 0) {
            map[lesson.id] = "partial";
            remainingPaid = 0;
        } else {
            map[lesson.id] = "no";
        }
    }

    return map;
}


/**
 * Modal: borrar historial del alumno hasta una fecha.
 * Se eliminan: asistidas totalmente pagadas y faltas.
 * Se conservan: pendientes, pago parcial y adeudadas.
 * Los pagos se ajustan por el monto de las asistidas borradas.
 */
function openClearUntilModal(studentId) {

    const student = getStudent(studentId);

    if (!student) {
        return;
    }

    const modal = document.getElementById("modal");

    modal.innerHTML = `

        <div class="modal-header">
            <div class="modal-title">
                Borrar historial hasta…
            </div>
            <button class="close" id="closeModal">×</button>
        </div>

        <p class="small muted" style="margin-top:0">
            Alumno: <b>${escapeHTML(student.name)}</b>
        </p>

        <p class="small muted">
            Se borrarán las clases hasta la fecha indicada (inclusive),
            excepto las <b>pendientes</b>, las con <b>pago parcial</b>
            y las que todavía se <b>adeudan</b>.
            Los pagos <b>no se borran</b> (el cobrado histórico se mantiene);
            las asistidas pagadas que se archiven quedan marcadas como liquidadas.
        </p>

        <div class="form-group">
            <label>Borrar clases hasta (inclusive)</label>
            <input
                type="date"
                id="clearUntilDate"
                value="${todayKey()}"
            >
        </div>

        <div class="actions">
            <button class="btn-secondary" id="cancelClearUntil">
                Cancelar
            </button>
            <button class="btn-danger" id="confirmClearUntil">
                Revisar y borrar
            </button>
        </div>

    `;

    openModal();

    document.getElementById("closeModal")
        .addEventListener("click", closeModal);

    document.getElementById("cancelClearUntil")
        .addEventListener("click", closeModal);

    document.getElementById("confirmClearUntil")
        .addEventListener("click", () => {

            const until = document.getElementById("clearUntilDate").value;

            if (!until) {
                alert("Seleccioná una fecha.");
                return;
            }

            clearLessonsUntilDate(studentId, until);
        });
}


function clearLessonsUntilDate(studentId, untilDate) {

    const student = getStudent(studentId);

    if (!student) {
        return;
    }

    const paidMap = getAttendedPaidStatusMap(studentId);

    const candidates = db.lessons.filter(l =>
        l.studentId === studentId &&
        l.date <= untilDate
    );

    const toDelete = [];
    let liquidateAmount = 0;
    let countAbsent = 0;
    let countPaid = 0;

    for (const lesson of candidates) {
        const st = lesson.status || "pending";

        // Pendientes (indeterminadas): no borrar
        if (st === "pending") {
            continue;
        }

        // Faltas: se pueden archivar (no afectan saldo)
        if (st === "absent") {
            toDelete.push(lesson);
            countAbsent++;
            continue;
        }

        // Asistidas: solo si están totalmente pagadas
        if (st === "attended") {
            const payStatus = paidMap[lesson.id];
            if (payStatus === "yes") {
                toDelete.push(lesson);
                liquidateAmount += Number(lesson.price) || 0;
                countPaid++;
            }
            // partial / no → se conservan
        }
    }

    if (toDelete.length === 0) {
        alert(
            "No hay clases para borrar hasta esa fecha " +
            "(solo quedarían pendientes, parciales o adeudadas)."
        );
        return;
    }

    const ok = confirm(
        `Alumno: ${student.name}\n` +
        `Hasta: ${formatLessonDate(untilDate)}\n\n` +
        `Se eliminarán ${toDelete.length} clase(s):\n` +
        `· ${countPaid} asistida(s) totalmente pagada(s)\n` +
        `· ${countAbsent} falta(s)\n\n` +
        (liquidateAmount > 0
            ? `Los pagos se conservan (cobrado histórico no baja).\n` +
              `Se marcarán ${formatMoney(liquidateAmount)} como ya liquidados.\n\n`
            : "") +
        `Se conservan pendientes, pagos parciales y clases adeudadas.\n\n` +
        `Recomendación: exportá un respaldo antes si no lo hiciste hace poco.\n\n` +
        `¿Continuar?`
    );

    if (!ok) {
        return;
    }

    const idsToRemove = new Set(toDelete.map(l => l.id));
    db.lessons = db.lessons.filter(l => !idsToRemove.has(l.id));

    // No se borran pagos: se acumula monto liquidado para el FIFO/saldo
    if (liquidateAmount > 0) {
        student.liquidatedAmount =
            getStudentLiquidated(studentId) + liquidateAmount;
    }

    saveDatabase();
    closeModal();
    render();

    showToast(`${toDelete.length} clase(s) eliminada(s)`);
}


function formatLessonDate(dateKeyStr) {

    try {
        const d = dateFromKey(dateKeyStr);
        return d.toLocaleDateString("es-AR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
    } catch {
        return dateKeyStr;
    }
}


/* =========================================================

function renderNavigation() {

    const nav = document.getElementById("nav");

    const sections = [
        ["calendar", "Mes"],
        ["day", "Día"],
        ["students", "Alumnos"],
        ["payments", "Pagos"],
        ["finances", "Finanzas"],
        ["data", "Datos"]
    ];

    nav.innerHTML = sections.map(section => `
        <button
            class="${state.section === section[0] ? "active" : ""}"
            data-section="${section[0]}"
        >
            ${section[1]}
        </button>
    `).join("");

    nav.querySelectorAll("[data-section]").forEach(button => {

        button.addEventListener("click", () => {

            state.section = button.dataset.section;

            render();
        });

    });
}


/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */

function render() {

    saveDatabase();

    renderNavigation();

    switch (state.section) {

        case "calendar":
            renderCalendar();
            break;

        case "day":
            renderDay();
            break;

        case "students":
            renderStudents();
            break;

        case "payments":
            renderPayments();
            break;

        case "finances":
            renderFinances();
            break;

        case "data":
            renderData();
            break;

    }
}


/* =========================================================
   CALENDARIO
   ========================================================= */

function renderCalendar() {

    const content = document.getElementById("content");

    const year = state.currentMonth.getFullYear();
    const month = state.currentMonth.getMonth();

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);

    /*
       Convertimos domingo=0 a lunes=0.
    */

    const firstWeekday =
        (firstDay.getDay() + 6) % 7;

    const selectedKey =
        dateKeyFromDate(state.selectedDate);

    let html = `
        <div class="dashboard">

            <div class="stat">
                <div class="stat-label">Clases hoy</div>
                <div class="stat-value">
                    ${db.lessons.filter(l => l.date === todayKey()).length}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">Alumnos</div>
                <div class="stat-value">
                    ${db.students.length}
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">Pendiente</div>
                <div class="stat-value">
                    ${formatMoney(getTotalPending())}
                </div>
            </div>

        </div>

        <div class="card">

            <div class="calendar-header">

                <button
                    class="btn-secondary"
                    id="previousMonth"
                >
                    ◀
                </button>

                <div class="calendar-title">
                    ${state.currentMonth.toLocaleDateString(
                        "es-AR",
                        {
                            month: "long",
                            year: "numeric"
                        }
                    )}
                </div>

                <button
                    class="btn-secondary"
                    id="nextMonth"
                >
                    ▶
                </button>

            </div>

            <div class="weekdays">
                ${["L","M","X","J","V","S","D"]
                    .map(day => `<div class="weekday">${day}</div>`)
                    .join("")
                }
            </div>

            <div class="calendar-grid">
    `;

    for (let i = 0; i < firstWeekday; i++) {
        html += `<div></div>`;
    }

    for (let day = 1; day <= lastDay.getDate(); day++) {

        const key = dateKey(year, month, day);

        const lessons = db.lessons
            .filter(lesson => lesson.date === key)
            .sort((a, b) =>
                a.time.localeCompare(b.time)
            );

        const classes = [
            "calendar-day"
        ];

        if (key === todayKey()) {
            classes.push("today");
        }

        if (key === selectedKey) {
            classes.push("selected");
        }

        html += `
            <div
                class="${classes.join(" ")}"
                data-date="${key}"
            >

                <div class="day-number">
                    ${day}${key === todayKey() ? ' <span class="today-tag">hoy</span>' : ""}
                </div>

                ${lessons.slice(0, 3).map(lesson => {

                    const student = getStudent(lesson.studentId);

                    let statusClass = "pending";

                    if (lesson.status === "attended") {
                        statusClass = "attended";
                    }

                    if (lesson.status === "absent") {
                        statusClass = "absent";
                    }

                    return `
                        <div class="lesson-mini ${statusClass}">
                            ${escapeHTML(lesson.time)}
                            ${student ? " " + escapeHTML(student.name) : ""}
                        </div>
                    `;

                }).join("")}

                ${
                    lessons.length > 3
                    ? `<div class="small muted">+${lessons.length - 3} más</div>`
                    : ""
                }

            </div>
        `;
    }

    html += `
            </div>
        </div>

        <div class="card">

            <div class="card-title">
                Acciones rápidas
            </div>

            <div class="small" style="margin-bottom:10px">
                Precio por hora (predeterminado):
                <b>${formatMoney(getHourlyRate())}</b>
            </div>

            <div class="actions" style="margin:0">
                <button
                    class="btn"
                    id="newClassCalendar"
                >
                    + Agregar clase
                </button>
                <button
                    class="btn-secondary"
                    id="editHourlyRateCalendar"
                >
                    Cambiar precio/hora
                </button>
            </div>

        </div>
    `;

    content.innerHTML = html;

    document
        .getElementById("editHourlyRateCalendar")
        .addEventListener("click", openHourlyRateEditor);

    document
        .getElementById("previousMonth")
        .addEventListener("click", () => {

            state.currentMonth = new Date(
                year,
                month - 1,
                1
            );

            render();

        });


    document
        .getElementById("nextMonth")
        .addEventListener("click", () => {

            state.currentMonth = new Date(
                year,
                month + 1,
                1
            );

            render();

        });


    document
        .querySelectorAll("[data-date]")
        .forEach(dayElement => {

            dayElement.addEventListener("click", () => {

                state.selectedDate =
                    dateFromKey(dayElement.dataset.date);

                state.section = "day";

                render();

            });

        });


    document
        .getElementById("newClassCalendar")
        .addEventListener("click", () => {

            openLessonModal(
                dateKeyFromDate(state.selectedDate)
            );

        });
}

                }

                lesson.status = "attended";
                saveDatabase();
                render();
                showToast("Marcada como asistió");

            });

        });


    document
        .querySelectorAll("[data-absent]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const lesson =
                    db.lessons.find(
                        x => x.id === button.dataset.absent
                    );

                if (!lesson) {
                    return;
                }

                const wasAttended = lesson.status === "attended";
                lesson.status = "absent";
                saveDatabase();
                render();

                if (
                    wasAttended &&
                    getStudentCredit(lesson.studentId) > 0
                ) {
                    showToast(
                        "Falta registrada. Si había pagos, quedan a favor."
                    );
                } else {
                    showToast("Marcada como faltó");
                }

            });

        });


    document
        .querySelectorAll("[data-edit-lesson]")
        .forEach(button => {

            button.addEventListener("click", () => {

                openLessonModal(
                    key,
                    button.dataset.editLesson
                );

            });

        });


    document
        .querySelectorAll("[data-delete-lesson]")
        .forEach(button => {

            button.addEventListener("click", () => {

                if (
                    !confirm(
                        "¿Querés eliminar esta clase?"
                    )
                ) {
                    return;
                }

                db.lessons =
                    db.lessons.filter(
                        lesson =>
                            lesson.id !== button.dataset.deleteLesson
                    );

                saveDatabase();
                render();

            });

        });


    document
        .querySelectorAll("[data-whatsapp]")
        .forEach(button => {

            button.addEventListener("click", () => {

                const lesson =
                    db.lessons.find(
                        x => x.id === button.dataset.whatsapp
                    );

                const student =
                    lesson
                        ? getStudent(lesson.studentId)
                        : null;

                if (!student || !student.phone) {
                    alert(
                        "Este alumno no tiene un número de WhatsApp."
                    );
                    return;
                }

                const when =
                    lesson.date === todayKey()
                        ? `hoy a las ${lesson.time}`
                        : `el ${formatLessonDate(lesson.date)} a las ${lesson.time}`;

                const message =
                    `Hola ${student.name}, te recuerdo tu clase ${when}.`;

                const phone =
                    normalizePhone(student.phone);

                window.open(
                    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
                    "_blank"
                );

            });

        });

}

function openLessonModal(dateKeyValue, lessonId = null) {

    if (db.students.length === 0) {

        alert(
            "Primero tenés que cargar al menos un alumno."
        );

        state.section = "students";
        render();

        return;
    }


    const editingLesson =
        lessonId
            ? db.lessons.find(
                lesson => lesson.id === lessonId
            )
            : null;


    const defaultStudent =
        editingLesson
            ? editingLesson.studentId
            : db.students[0].id;


    const defaultTime =
        editingLesson
            ? editingLesson.time
            : "16:00";


    const defaultDuration =
        editingLesson
            ? editingLesson.duration
            : 60;


    // Nueva clase: por defecto modo hora + tarifa global
    // Edición: respeta el modo guardado (clases viejas = por clase)
    const defaultPriceMode =
        editingLesson
            ? (editingLesson.priceMode === "hour" ? "hour" : "class")
            : "hour";

    const defaultHourlyRate =
        editingLesson && editingLesson.priceMode === "hour"
            ? (Number(editingLesson.hourlyRate) || getHourlyRate())
            : getHourlyRate();

    const defaultClassPrice =
        editingLesson
            ? (Number(editingLesson.price) || 0)
            : Math.round(
                getHourlyRate() *
                ((Number(defaultDuration) || 60) / 60)
            );


    const modal =
        document.getElementById("modal");


    modal.innerHTML = `

        <div class="modal-header">

            <div class="modal-title">
                ${editingLesson
                    ? "Editar clase"
                    : "Nueva clase"
                }
            </div>

            <button
                class="close"
                id="closeModal"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label>Fecha</label>

            <input
                type="date"
                id="lessonDate"
                value="${dateKeyValue}"
            >

        </div>


        <div class="form-group">

            <label>Alumno</label>

            <select id="lessonStudent">

                ${(editingLesson
                    ? db.students
                    : getActiveStudents().length
                        ? getActiveStudents()
                        : db.students
                ).map(student => `
                    <option
                        value="${student.id}"
                        ${student.id === defaultStudent ? "selected" : ""}
                    >
                        ${escapeHTML(student.name)}${student.inactive ? " (inactivo)" : ""}
                    </option>
                `).join("")}

            </select>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label>Hora</label>

                <input
                    type="time"
                    id="lessonTime"
                    value="${defaultTime}"
                >

            </div>


            <div class="form-group">

                <label>Duración</label>

                <select id="lessonDuration">

                    ${[30, 60, 90, 120].map(minutes => `
                        <option
                            value="${minutes}"
                            ${Number(defaultDuration) === minutes ? "selected" : ""}
                        >
                            ${minutes} minutos
                        </option>
                    `).join("")}

                </select>

            </div>

        </div>


        <div class="form-group">
            <label>Cómo calcular el precio</label>
            <select id="lessonPriceMode">
                <option value="hour" ${
                    defaultPriceMode === "hour" ? "selected" : ""
                }>
                    Precio por hora × duración
                </option>
                <option value="class" ${
                    defaultPriceMode === "class" ? "selected" : ""
                }>
                    Precio por clase (fijo)
                </option>
            </select>
            <div class="small muted" style="margin-top:6px">
                La tarifa horaria predeterminada se cambia desde Mes o Día.
            </div>
        </div>

        <div class="form-group" id="lessonPriceClassGroup">
            <label>Precio de esta clase ($)</label>
            <input
                type="number"
                id="lessonPrice"
                min="0"
                step="1"
                value="${Number(defaultClassPrice) || 0}"
            >
        </div>

        <div class="form-group" id="lessonPriceHourGroup" style="display:none">
            <label>Precio por hora ($)</label>
            <input
                type="number"
                id="lessonHourlyRate"
                min="0"
                step="1"
                value="${Number(defaultHourlyRate) || 0}"
            >
            <div class="small muted" id="lessonPricePreview" style="margin-top:6px">
                Total de la clase: —
            </div>
        </div>

        ${
            editingLesson
            ? ""
            : `
        <div class="form-group">
            <label>Repetir las próximas semanas</label>
            <select id="lessonRepeatWeeks">
                <option value="0" selected>No repetir (solo esta fecha)</option>
                <option value="1">1 semana más</option>
                <option value="2">2 semanas más</option>
                <option value="3">3 semanas más</option>
                <option value="4">4 semanas más</option>
                <option value="6">6 semanas más</option>
                <option value="8">8 semanas más</option>
            </select>
            <div class="small muted" style="margin-top:6px">
                Crea la misma clase (alumno, hora, duración, precio) en las semanas siguientes.
            </div>
        </div>
            `
        }


        <div class="actions">

            <button
                class="btn-secondary"
                id="cancelLesson"
            >
                Cancelar
            </button>

            <button
                class="btn"
                id="saveLesson"
            >
                ${editingLesson
                    ? "Guardar cambios"
                    : "Agregar clase"
                }
            </button>

        </div>

    `;


    openModal();


    function getLessonPriceMode() {
        return document.getElementById("lessonPriceMode").value === "hour"
            ? "hour"
            : "class";
    }


    function calcHourlyTotal() {
        const duration = Number(
            document.getElementById("lessonDuration").value
        ) || 0;
        const rate = Number(
            document.getElementById("lessonHourlyRate").value
        ) || 0;
        // Redondeo al peso entero más cercano
        return Math.round(rate * (duration / 60));
    }


    function updatePriceModeUI() {
        const mode = getLessonPriceMode();
        const classGroup = document.getElementById("lessonPriceClassGroup");
        const hourGroup = document.getElementById("lessonPriceHourGroup");
        const preview = document.getElementById("lessonPricePreview");

        if (mode === "hour") {
            classGroup.style.display = "none";
            hourGroup.style.display = "";
            const total = calcHourlyTotal();
            preview.textContent =
                "Total de la clase: " + formatMoney(total) +
                " (" +
                document.getElementById("lessonDuration").value +
                " min)";
            document.getElementById("lessonPrice").value = total;
        } else {
            classGroup.style.display = "";
            hourGroup.style.display = "none";
        }
    }


    document
        .getElementById("closeModal")
        .addEventListener("click", closeModal);


    document
        .getElementById("cancelLesson")
        .addEventListener("click", closeModal);


    document
        .getElementById("lessonPriceMode")
        .addEventListener("change", updatePriceModeUI);


    document
        .getElementById("lessonDuration")
        .addEventListener("change", updatePriceModeUI);


    document
        .getElementById("lessonHourlyRate")
        .addEventListener("input", updatePriceModeUI);


    /*
        Al cambiar de alumno, proponemos
        automáticamente su precio habitual.
    */

    document
        .getElementById("lessonStudent")
        .addEventListener("change", event => {

            const student =
                getStudent(event.target.value);

            if (student && !editingLesson) {
                // En modo clase: precio habitual del alumno
                // En modo hora: se mantiene la tarifa horaria global
                const habitual = Number(student.price) || 0;
                if (habitual > 0) {
                    document.getElementById("lessonPrice").value = habitual;
                }
                updatePriceModeUI();
            }

        });


    updatePriceModeUI();


    document
        .getElementById("saveLesson")
        .addEventListener("click", () => {

            const date =
                document.getElementById("lessonDate").value;

            const studentId =
                document.getElementById("lessonStudent").value;

            const time =
                document.getElementById("lessonTime").value;

            const duration =
                Number(
                    document.getElementById("lessonDuration").value
                );

            const priceMode = getLessonPriceMode();
            let hourlyRate = null;
            let price;

            if (priceMode === "hour") {
                hourlyRate = Number(
                    document.getElementById("lessonHourlyRate").value
                );
                if (!Number.isFinite(hourlyRate) || hourlyRate < 0) {
                    alert("El precio por hora no es válido.");
                    return;
                }
                price = Math.round(hourlyRate * (duration / 60));
            } else {
                price = Number(
                    document.getElementById("lessonPrice").value
                );
            }


            if (!date) {
                alert("Seleccioná una fecha.");
                return;
            }

            if (!studentId) {
                alert("Seleccioná un alumno.");
                return;
            }

            if (!time) {
                alert("Seleccioná una hora.");
                return;
            }

            if (!Number.isFinite(price) || price < 0) {
                alert("El precio no es válido.");
                return;
            }


            /*
                Máximo 4 alumnos simultáneos.
                Al editar excluimos la propia clase.
                Al crear con repetición se valida fecha por fecha.
            */

            if (editingLesson) {
                const simultaneous =
                    db.lessons.filter(lesson =>
                        lesson.date === date &&
                        lesson.time === time &&
                        lesson.id !== lessonId
                    ).length;

                if (simultaneous >= 4) {
                    alert(
                        "Ya hay 4 alumnos en ese horario."
                    );
                    return;
                }
            }


            const previousPrice = editingLesson
                ? Number(editingLesson.price) || 0
                : null;

            if (editingLesson) {

                editingLesson.date = date;
                editingLesson.studentId = studentId;
                editingLesson.time = time;
                editingLesson.duration = duration;
                editingLesson.price = price;
                editingLesson.priceMode = priceMode;
                if (priceMode === "hour") {
                    editingLesson.hourlyRate = hourlyRate;
                } else {
                    delete editingLesson.hourlyRate;
                }

            } else {

                const repeatWeeks = Number(
                    document.getElementById("lessonRepeatWeeks")?.value || 0
                );

                const datesToCreate = [date];
                for (let w = 1; w <= repeatWeeks; w++) {
                    datesToCreate.push(addWeeksToDateKey(date, w));
                }

                let created = 0;
                let skipped = 0;

                datesToCreate.forEach(d => {
                    const simultaneous = db.lessons.filter(lesson =>
                        lesson.date === d &&
                        lesson.time === time
                    ).length;

                    if (simultaneous >= 4) {
                        skipped++;
                        return;
                    }

                    const lessonObj = {
                        id: generateId("lesson"),
                        date: d,
                        studentId,
                        time,
                        duration,
                        price,
                        priceMode,
                        status: "pending"
                    };
                    if (priceMode === "hour") {
                        lessonObj.hourlyRate = hourlyRate;
                    }

                    db.lessons.push(lessonObj);
                    created++;
                });

                if (created === 0) {
                    alert(
                        "No se pudo crear ninguna clase (horario lleno)."
                    );
                    return;
                }

                saveDatabase();
                closeModal();

                state.selectedDate = dateFromKey(date);
                state.currentMonth = new Date(
                    state.selectedDate.getFullYear(),
                    state.selectedDate.getMonth(),
                    1
                );
                state.section = "day";
                render();

                let msg = created === 1
                    ? "Clase agregada"
                    : created + " clases agregadas";
                if (skipped > 0) {
                    msg += ` (${skipped} omitida(s) por horario lleno)`;
                }
                showToast(msg);
                return;
            }


            saveDatabase();
            closeModal();

            state.selectedDate =
                dateFromKey(date);

            state.currentMonth =
                new Date(
                    state.selectedDate.getFullYear(),
                    state.selectedDate.getMonth(),
                    1
                );


            state.section = "day";

            render();

            if (
                editingLesson &&
                previousPrice !== null &&
                previousPrice !== price &&
                editingLesson.status === "attended"
            ) {
                showToast(
                    "Clase actualizada. El saldo se recalculó con el nuevo precio."
                );
            } else {
                showToast(
                    editingLesson
                        ? "Clase actualizada"
                        : "Clase agregada"
                );
            }

        });

}

function deleteStudent(studentId) {

    const student =
        getStudent(studentId);

    if (!student) {
        return;
    }


    const hasLessons =
        db.lessons.some(
            lesson =>
                lesson.studentId === studentId
        );


    const hasPayments =
        db.payments.some(
            payment =>
                payment.studentId === studentId
        );


    if (hasLessons || hasPayments) {

        alert(
            "No se puede eliminar este alumno porque tiene clases o pagos registrados. Esto evita perder información histórica."
        );

        return;
    }


    if (
        !confirm(
            `¿Eliminar a ${student.name}?`
        )
    ) {
        return;
    }


    db.students =
        db.students.filter(
            s => s.id !== studentId
        );


    saveDatabase();
    render();

    showToast("Alumno eliminado");
}

    // solo clases a las que ASISTIÓ y todavía adeuda (total o parcial).

    const credit = getStudentCredit(studentId);
    const pendingLessons = getStudentPendingLessons(studentId);

    let lessonsRows = "";

        lessonsRows = `
            <tr>
                <td colspan="4" style="text-align:center;color:#94a3b8">

                </td>
            </tr>
        `;
    } else {
        lessonsRows = pendingLessons.map(lesson => `
            <tr>

    });

        <div class="print-doc">

            <h1>Agenda de alumnos particulares</h1>
            <div class="meta">
                Comprobante de alumno · Generado: ${escapeHTML(generatedAt)}

            <p style="font-size:14px;font-weight:600;margin:0 0 2px;color:#0f172a">
                ${escapeHTML(student.name)}

            ${
                student.phone
                ? `<p style="margin:0 0 16px;font-size:12px;color:#64748b">
                    ${escapeHTML(student.phone)}
                   </p>`
                : `<p style="margin:0 0 16px"></p>`
            }

            <h2 style="margin:18px 0 8px">
                Clases adeudadas
                <span style="font-weight:400;font-size:11px;color:#94a3b8;text-transform:none;letter-spacing:0">
                    · solo asistió · de más antigua a más reciente
                </span>
            </h2>

            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Duración</th>
                        <th>Adeuda</th>
                    </tr>
                </thead>
                <tbody>
                    ${lessonsRows}
                </tbody>
            </table>

            <table style="margin-top:20px">
                <tr class="total-row">
                    <td>${
                        credit > 0
                        ? "A favor"
                        : (balance > 0 ? "Debe" : "Al día")
                    }</td>
                    <td style="text-align:right">${formatMoney(
                        credit > 0 ? credit : balance
                    )}</td>
                </tr>
            </table>

            <div class="print-footer">
                Agenda de alumnos particulares · Documento generado automáticamente
            </div>

        </div>
    `;

    const modal = document.getElementById("modal");

    modal.innerHTML = `

        <div class="modal-header no-print">

            <div class="modal-title">
                Comprobante · ${escapeHTML(student.name)}
            </div>

            <button class="close" id="closeModal">×</button>

        </div>

        <div id="printArea">
            ${html}
        </div>

        <div class="actions no-print" style="margin-top:16px">

            <button class="btn-secondary" id="cancelPDF">
                Cerrar
            </button>

            <button class="btn" id="printPDF">
                Imprimir / Guardar PDF
            </button>

        </div>

    `;

    openModal();

    document.getElementById("closeModal")
        .addEventListener("click", closeModal);

    document.getElementById("cancelPDF")
        .addEventListener("click", closeModal);

    document.getElementById("printPDF")
        .addEventListener("click", () => {
            const originalTitle = document.title;

            const safeName = String(student.name || "alumno")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-zA-Z0-9]+/g, "_")
                .replace(/^_+|_+$/g, "")
                .toLowerCase() || "alumno";

            const now = new Date();
            // Formato local: DD-MM-YYYY_HH-MM-SS
            // (guiones en la hora: ":" no es válido en nombres de archivo en Windows)
            const fecha =
                String(now.getDate()).padStart(2, "0") +
                "-" +
                String(now.getMonth() + 1).padStart(2, "0") +
                "-" +
                String(now.getFullYear());
            const hora =
                String(now.getHours()).padStart(2, "0") +
                "-" +
                String(now.getMinutes()).padStart(2, "0") +
                "-" +
                String(now.getSeconds()).padStart(2, "0");

            // El navegador usa document.title como nombre por defecto al "Guardar como PDF"
            document.title = safeName + "_" + fecha + "_" + hora;

            window.print();

            setTimeout(() => {
                document.title = originalTitle;
            }, 1000);
        });
}

        const studentId =
            document.getElementById("paymentStudent").value;

        const preview =
            document.getElementById("paymentPendingPreview");

        const balance = getStudentBalance(studentId);
        const credit = getStudentCredit(studentId);
        const pending =
            getStudentPendingLessons(studentId);

        let info = `
            <div style="margin-bottom:6px">
                ${
                    credit > 0
                    ? `Crédito a favor: <b>${formatMoney(credit)}</b>`
                    : `Saldo adeudado: <b>${formatMoney(balance)}</b>`
                }
            </div>
            <div style="margin-bottom:6px">
                Podés pagar de más: el excedente queda a favor y se usa en próximas asistencias.
            </div>
        `;

        if (pending.length > 0) {
            info += `
                <div style="margin-bottom:4px">
                    Clases con saldo (de más antigua a más reciente):
                </div>
                ${pending.map(l => `
                    <div>

                        (${l.duration} min) — ${formatMoney(l.owed)}
                    </div>
                `).join("")}
            `;

            info += "Sin clases asistidas con deuda. Un pago quedará como adelanto.";
        }

        preview.innerHTML = info;
    }

    updatePaymentPreview();

    document
        .getElementById("paymentStudent")
        .addEventListener("change", updatePaymentPreview);


    document
        .getElementById("closeModal")
        .addEventListener("click", closeModal);


    document
        .getElementById("cancelPayment")
        .addEventListener("click", closeModal);


    document
        .getElementById("savePayment")
        .addEventListener("click", () => {

            const studentId =
                document
                    .getElementById("paymentStudent")
                    .value;

            const amount =
                Number(
                    document
                        .getElementById("paymentAmount")
                        .value
                );

            const date =
                document
                    .getElementById("paymentDate")
                    .value;

            const note =
                document
                    .getElementById("paymentNote")
                    .value
                    .trim();


            if (!studentId) {

                alert(
                    "Seleccioná un alumno."
                );

                return;
            }


            if (
                !Number.isFinite(amount) ||
                amount <= 0
            ) {

                alert(
                    "Ingresá un monto válido."
                );

                return;
            }


            if (!date) {

                alert(
                    "Seleccioná una fecha."
                );

                return;
            }


            if (editingPayment) {

                editingPayment.studentId = studentId;
                editingPayment.amount = amount;
                editingPayment.date = date;
                editingPayment.note = note;

            } else {

                db.payments.push({

                    id: generateId("payment"),

                    studentId,

                    amount,

                    date,

                    note

                });

            }


            saveDatabase();
            closeModal();
            render();

            showToast(
                editingPayment
                    ? "Pago actualizado"
                    : "Pago registrado"
            );

        });

}


function deletePayment(paymentId) {

    const payment = db.payments.find(p => p.id === paymentId);

    if (!payment) {
        return;
    }

    const student = getStudent(payment.studentId);
    const name = student ? student.name : "este alumno";

    if (
        !confirm(
            `¿Eliminar el pago de ${formatMoney(payment.amount)} de ${name}?`
        )
    ) {
        return;
    }

    db.payments = db.payments.filter(p => p.id !== paymentId);

    saveDatabase();
    render();

    showToast("Pago eliminado");
}

function monthKeyFromDateStr(dateStr) {
    // YYYY-MM-DD → YYYY-MM
    return String(dateStr || "").slice(0, 7);
}


function formatMonthKey(ym) {
    if (!ym || ym.length < 7) return ym || "—";
    const [y, m] = ym.split("-");
    const months = [
        "enero", "febrero", "marzo", "abril", "mayo", "junio",
        "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"
    ];
    const idx = Number(m) - 1;
    const name = months[idx] || m;
    return name.charAt(0).toUpperCase() + name.slice(1) + " " + y;
}

    );

        String(now.getMonth() + 1).padStart(2, "0");

    const paidThisMonth = db.payments
        .filter(p => monthKeyFromDateStr(p.date) === thisMonthKey)
        .reduce((sum, p) => sum + Number(p.amount || 0), 0);

    // Caja: pagos por fecha de cobro
    const byMonthGlobal = {};
    db.payments.forEach(p => {
        const k = monthKeyFromDateStr(p.date);
        if (!k) return;
        byMonthGlobal[k] = (byMonthGlobal[k] || 0) + Number(p.amount || 0);
    });
    const monthKeysGlobal = Object.keys(byMonthGlobal).sort().reverse();

    const studentsWithActivity = db.students

    const studentBlocks = db.students.length === 0

        : studentsWithActivity.length === 0
        ? `<div class="card empty">Ningún alumno tiene clases o pagos todavía.</div>`
        : studentsWithActivity
            .map(student => {

                ).length;
                const absent = db.lessons.filter(

                ).length;

                const paidTotal = getStudentRawPaid(sid);

                // Pagos por mes = fecha en que se registró el cobro
                const payByMonth = {};
                db.payments
                    .filter(p => p.studentId === sid)
                    .forEach(p => {
                        const k = monthKeyFromDateStr(p.date);
                        if (!k) return;
                        payByMonth[k] = (payByMonth[k] || 0) + Number(p.amount || 0);
                    });

                // Clases por mes = fecha de la clase (solo las aún en agenda)
                const classByMonth = {};

                        } else if (l.status === "absent") {

                        }
                    });

                const monthKeys = Array.from(
                    new Set([
                        ...Object.keys(payByMonth),
                        ...Object.keys(classByMonth)
                    ])
                ).sort().reverse();

                let monthRows = "";
                if (monthKeys.length === 0) {
