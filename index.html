                                                </div>
                                                <div style="color:var(--text)">
                                                    Asistió <b>${att}</b> · Faltó <b>${abs}</b>
                                                </div>
                                            </div>
                                            <div style="text-align:right">
                                                <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.03em;margin-bottom:2px">
                                                    Cobrado en el mes
                                                </div>
                                                <div style="color:var(--text)">
                                                    <b>${formatMoney(paid)}</b>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join("")}
                        </div>
                    `;
                }

                return `
                    <div class="card" style="margin-bottom:12px">
                        <div style="
                            display:flex;
                            justify-content:space-between;
                            align-items:flex-start;
                            gap:10px;
                        ">
                            <div>
                                <div style="font-weight:600;color:var(--text)">
                                    ${escapeHTML(student.name)}
                                </div>
                                <div class="small muted" style="margin-top:4px">
                                    En agenda:
                                    asistió <b>${attended}</b>
                                    · faltó <b>${absent}</b>
                                    ${
                                        pendingStatus > 0
                                        ? `· pendientes <b>${pendingStatus}</b>
                                           <span style="opacity:0.85">(no suman deuda)</span>`
                                        : ""
                                    }
                                </div>
                                <div class="small muted" style="margin-top:2px;font-size:11px">
                                    Asistencias/faltas = clases aún cargadas (no incluye archivadas).
                                </div>
                            </div>
                            <div
                                class="balance ${bal.css}"
                                style="flex-shrink:0"
                            >
                                ${bal.text}
                            </div>
                        </div>

                        <div class="small" style="margin-top:10px">
                            Cobrado en total (todos los pagos):
                            <b>${formatMoney(paidTotal)}</b>
                        </div>

                        ${monthRows}
                    </div>
                `;
            }).join("");

    const attendedThisMonth = db.lessons.filter(
        l =>
            monthKeyFromDateStr(l.date) === thisMonthKey &&
            l.status === "attended"
    ).length;
    const absentThisMonth = db.lessons.filter(
        l =>
            monthKeyFromDateStr(l.date) === thisMonthKey &&
            l.status === "absent"
    ).length;

    content.innerHTML = `

        <div class="card" style="margin-bottom:12px">
            <p class="small muted" style="margin:0">
                Vista de solo lectura. El <b>cobrado</b> se agrupa por la fecha del pago
                (cuándo entró la plata). Las <b>clases</b> se agrupan por la fecha de la clase.
                Si alguien paga en octubre clases de septiembre, el dinero cuenta en octubre.
            </p>
        </div>

        <div class="card">
            <div class="card-title">Mes en curso · ${formatMonthKey(thisMonthKey)}</div>
            <div class="dashboard" style="margin:0">
                <div class="stat">
                    <div class="stat-label">Cobrado este mes</div>
                    <div class="stat-value">${formatMoney(paidThisMonth)}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Clases asistió</div>
                    <div class="stat-value">${attendedThisMonth}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Clases faltó</div>
                    <div class="stat-value">${absentThisMonth}</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Pendiente cobrar</div>
                    <div class="stat-value">${formatMoney(totalPending)}</div>
                </div>
            </div>
        </div>

        <div class="dashboard">

            <div class="stat">
                <div class="stat-label">Cobrado histórico</div>
                <div class="stat-value">${formatMoney(totalPaid)}</div>
            </div>

            <div class="stat">
                <div class="stat-label">Crédito a favor</div>
                <div class="stat-value">${formatMoney(totalCredit)}</div>
            </div>

        </div>

        <div class="card">
            <div class="card-title">Cobrado por mes</div>
            <p class="small muted" style="margin-top:0;margin-bottom:8px">
                Según la fecha en que registraste el pago (caja del mes).
            </p>
            ${
                monthKeysGlobal.length === 0
                ? `<div class="empty">Todavía no hay pagos.</div>`
                : monthKeysGlobal.map(k => `
                    <div style="
                        display:flex;
                        justify-content:space-between;
                        padding:8px 0;
                        border-bottom:1px solid var(--border);
                        font-size:14px;
                    ">
                        <span>${formatMonthKey(k)}</span>
                        <b>${formatMoney(byMonthGlobal[k])}</b>
                    </div>
                `).join("")
            }
        </div>

        <div class="card" style="padding-bottom:4px">
            <div class="card-title">Por alumno</div>
            <p class="small muted" style="margin-top:0;margin-bottom:8px">
                Saldo = solo clases asistidas aún en agenda.
                Cobrado total = suma de pagos (aunque hayas archivado clases).
            </p>
        </div>

        ${studentBlocks}

    `;
}


/* =========================================================
   DATOS / BACKUP
   ========================================================= */

function renderData() {

    const content =
        document.getElementById("content");


    const size =
        new Blob([
            JSON.stringify(db)
        ]).size;


    content.innerHTML = `

        <div class="card">

            <div class="card-title">
                Datos y respaldo
            </div>

            <p class="small muted">
                Tus datos se guardan automáticamente
                en este dispositivo y navegador.
            </p>

            <p class="small muted" style="margin-top:0">
                Último respaldo exportado:
                <b>${escapeHTML(formatLastBackupLabel())}</b>
            </p>

            <p class="small muted">
                Recomendación: exportá y guardá el archivo en
                <b>Google Drive</b> o una <b>carpeta fija</b> de la PC.
                El nombre será del tipo
                <b>agenda-alumnos-backup-${todayKey()}.json</b>.
            </p>

            <button
                class="btn"
                id="exportData"
            >
                Exportar respaldo
            </button>

            <div class="form-group" style="margin-top:12px">

                <label>
                    Restaurar un respaldo
                </label>

                <input
                    type="file"
                    id="importFile"
                    accept=".json,application/json"
                >

            </div>

            <button
                class="btn-secondary"
                id="importData"
            >
                Restaurar respaldo
            </button>

        </div>


        <div class="card">

            <div class="card-title">
                Información
            </div>

            <div class="small">
                Alumnos:
                <b>${db.students.length}</b>
            </div>

            <div class="small">
                Clases:
                <b>${db.lessons.length}</b>
            </div>

            <div class="small">
                Pagos:
                <b>${db.payments.length}</b>
            </div>

            <div class="small">
                Tamaño de datos:
                <b>${Math.ceil(size / 1024)} KB</b>
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Zona de seguridad
            </div>

            <p class="small muted">
                Borrar los datos elimina la información
                guardada en este navegador.
                Antes de hacerlo, exportá un respaldo.
            </p>

            <button
                class="btn-danger"
                id="deleteAll"
            >
                Borrar todos los datos
            </button>

        </div>

    `;


    document
        .getElementById("exportData")
        .addEventListener("click", exportData);


    document
        .getElementById("importData")
        .addEventListener("click", importData);


    document
        .getElementById("deleteAll")
        .addEventListener("click", deleteAllData);

}


function getLastBackupAt() {
    try {
        return localStorage.getItem(BACKUP_META_KEY) || null;
    } catch {
        return null;
    }
}


function setLastBackupAt(iso) {
    try {
        localStorage.setItem(BACKUP_META_KEY, iso);
    } catch (e) {
        console.warn(e);
    }
}


function formatLastBackupLabel() {
    const iso = getLastBackupAt();
    if (!iso) {
        return "Nunca";
    }
    try {
        const d = new Date(iso);
        return d.toLocaleString("es-AR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    } catch {
        return iso;
    }
}


function daysSinceLastBackup() {
    const iso = getLastBackupAt();
    if (!iso) {
        return Infinity;
    }
    const then = new Date(iso).getTime();
    if (!Number.isFinite(then)) {
        return Infinity;
    }
    return (Date.now() - then) / (1000 * 60 * 60 * 24);
}


function maybeRemindBackup() {
    try {
        if (sessionStorage.getItem("agenda_backup_reminded") === "1") {
            return;
        }

        const days = daysSinceLastBackup();
        let lastActivity = null;
        try {
            lastActivity = localStorage.getItem("agenda_alumnos_last_activity");
        } catch (e) {
            lastActivity = null;
        }

        const hasData =
            db.students.length > 0 ||
            db.lessons.length > 0 ||
            db.payments.length > 0;

        if (!hasData) {
            return;
        }

        const activityAfterBackup =
            lastActivity &&
            getLastBackupAt() &&
            new Date(lastActivity).getTime() > new Date(getLastBackupAt()).getTime();

        let msg = null;

        if (!getLastBackupAt()) {
            msg = "Todavía no exportaste un respaldo. Andá a Datos y guardalo en Drive o una carpeta fija.";
        } else if (days >= 14) {
            msg = "Pasaron más de 14 días sin exportar un respaldo. Conviene hacer uno en Datos.";
        } else if (days >= 7 && activityAfterBackup) {
            msg = "Hubo movimientos y el último respaldo tiene más de 7 días. Conviene exportar en Datos.";
        }

        if (msg) {
            sessionStorage.setItem("agenda_backup_reminded", "1");
            setTimeout(() => showToast(msg), 800);
        }
    } catch (e) {
        // sessionStorage puede fallar en algunos contextos
    }
}


function exportData() {

    const exportedAt = new Date().toISOString();

    const backup = {

        app: "Agenda de alumnos particulares",

        version: 6,

        exportedAt,

        data: db

    };


    const blob =
        new Blob(
            [JSON.stringify(backup, null, 2)],
            {
                type: "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;

    // Nombre claro para guardar en Drive / carpeta fija
    link.download =
        "agenda-alumnos-backup-" +
        todayKey() +
        ".json";


    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    setLastBackupAt(exportedAt);

    showToast(
        "Respaldo exportado"
    );

    // Refrescar la sección Datos si estamos ahí
    if (state.section === "data") {
        render();
    }
}


function importData() {

    const input =
        document.getElementById("importFile");


    const file =
        input.files[0];


    if (!file) {

        alert(
            "Seleccioná primero un archivo JSON."
        );

        return;
    }


    if (
        !confirm(
            "Importar este respaldo reemplazará los datos actuales. ¿Continuar?"
        )
    ) {
        return;
    }


    const reader =
        new FileReader();


    reader.onload = () => {

        try {

            const parsed =
                JSON.parse(reader.result);


            /*
                Aceptamos tanto:

                { students, lessons, payments }

                como:

                { app, version, data }
            */

            const imported =
                parsed.data || parsed;


            if (
                !imported ||
                !Array.isArray(imported.students) ||
                !Array.isArray(imported.lessons) ||
                !Array.isArray(imported.payments)
            ) {

                throw new Error(
                    "Formato inválido"
                );

            }


            db = normalizeDbPayload(imported);


            saveDatabase();
            render();

            showToast(
                "Respaldo restaurado"
            );


        } catch (error) {

            console.error(error);

            alert(
                "No se pudo importar el respaldo. El archivo no parece ser válido."
            );

        }

    };


    reader.readAsText(file);

}


function deleteAllData() {

    const confirmation =
        prompt(
            'Para borrar todo escribí: BORRAR'
        );


    if (confirmation !== "BORRAR") {

        return;
    }


    db =
        structuredClone(DEFAULT_DB);


    saveDatabase();
    render();

    showToast(
        "Todos los datos fueron eliminados"
    );
}


/* =========================================================
   WHATSAPP
   ========================================================= */

function normalizePhone(phone) {

    return String(phone || "")
        .replace(/\D/g, "");

}


/* =========================================================
   BOTÓN FLOTANTE
   ========================================================= */

document
    .getElementById("fab")
    .addEventListener("click", () => {

        if (state.section === "students") {

            openStudentModal();

            return;
        }

        if (state.section === "payments") {

            openPaymentModal();

            return;
        }

        openLessonModal(
            dateKeyFromDate(
                state.selectedDate
            )
        );

    });


/* =========================================================
   INICIO
   ========================================================= */

// Si hoy hay clases sin marcar, abrir en Día para agilizar la rutina
(function initStartSection() {
    try {
        const today = todayKey();
        const unmarked = getUnmarkedLessonsForDate(today);
        if (unmarked.length > 0) {
            state.section = "day";
            const now = new Date();
            state.selectedDate = new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate(),
                12, 0, 0, 0
            );
        }
    } catch (e) {
        /* ignore */
    }
})();

render();
maybeRemindBackup();


/* PWA: service worker (requiere servir por http/https, no file://) */
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker
            .register("./sw.js")
            .catch((err) => {
                console.warn("Service worker no registrado:", err);
            });
    });
}
